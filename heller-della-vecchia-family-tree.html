function getRelatives(pid){
  const rels=[];const seen=new Set();
  for(const r of REL_LINKS){if(r.children&&r.children.includes(pid)){for(const parentId of r.couple){const par=byId[parentId];if(par&&!seen.has(par.id)){seen.add(par.id);rels.push({person:par,rel:par.gender==="m"?"Father":"Mother"});}}}}
  for(const r of REL_LINKS){if(r.couple&&r.couple.includes(pid)&&r.children){for(const cid of r.children){const ch=byId[cid];if(ch&&!seen.has(ch.id)){seen.add(ch.id);rels.push({person:ch,rel:ch.gender==="m"?"Son":"Daughter"});}}}}
  for(const pair of PARTNER_LINKS){if(pair.includes(pid)){const oid=pair[0]===pid?pair[1]:pair[0];const o=byId[oid];if(o&&!seen.has(o.id)){seen.add(o.id);rels.push({person:o,rel:"Partner"});}}}
  const parentSets=[];for(const r of REL_LINKS){if(r.children&&r.children.includes(pid))parentSets.push(r);}
  for(const ps of parentSets){for(const sibId of ps.children){if(sibId!==pid&&!seen.has(sibId)){const sib=byId[sibId];if(sib){seen.add(sib.id);rels.push({person:sib,rel:sib.gender==="m"?"Brother":"Sister"});}}}}
  return rels;
}

function parseDob(d){if(!d||d==="TBD")return{month:null,year:null};const M={Jan:1,Feb:2,Mar:3,Apr:4,May:5,Jun:6,Jul:7,Aug:8,Sep:9,Oct:10,Nov:11,Dec:12};if(/^\d{4}$/.test(d))return{month:null,year:parseInt(d)};const a=d.match(/^([A-Z][a-z]+)\s+(\d+)$/);if(a)return{month:M[a[1]]||null,year:null};const b=d.match(/^([A-Z][a-z]+)\s+(\d+),?\s+(\d{4})$/);if(b)return{month:M[b[1]]||null,year:parseInt(b[3])};return{month:null,year:null};}
function matchSearch(p,q){const s=q.toLowerCase().trim();if(!s)return true;const d=parseDob(p.dob);if(/^\d{4}$/.test(s)&&d.year===parseInt(s))return true;const mn=["january","february","march","april","may","june","july","august","september","october","november","december"];const ma=["jan","feb","mar","apr","may","jun","jul","aug","sep","oct","nov","dec"];const i=mn.findIndex(m=>m.startsWith(s));const i2=ma.findIndex(m=>m===s);const mm=i>=0?i+1:(i2>=0?i2+1:null);if(mm&&d.month===mm)return true;return[p.name,p.nick,p.role,p.loc,p.dob].filter(Boolean).join(" ").toLowerCase().includes(s);}

function TreeCard({personId,onClick}){const p=byId[personId];if(!p)return null;const gc=p.gender==="m"?C.m:C.f;const bc=p.died?C.pa:gc;return(<div onClick={()=>onClick(p)} style={{background:C.card,border:`2px solid ${bc}`,borderRadius:10,padding:"10px 8px 8px",width:120,cursor:"pointer",display:"flex",flexDirection:"column",alignItems:"center",gap:4,boxShadow:C.ss,opacity:p.died?.7:1,flexShrink:0}}><div style={{width:48,height:48,borderRadius:"50%",border:`2.5px solid ${bc}`,background:`${gc}18`,display:"flex",alignItems:"center",justifyContent:"center",fontSize:15,fontWeight:600,color:gc,fontFamily:"'Crimson Pro',serif"}}>{getInitials(p.name)}</div><div style={{fontSize:11,fontWeight:600,textAlign:"center",color:C.tp,lineHeight:1.2,fontFamily:"'Crimson Pro',serif"}}>{p.nick?`${p.name.split(" ")[0]} "${p.nick}"`:p.name.split(" ").slice(0,2).join(" ")}</div><div style={{fontSize:9,color:C.tm,textAlign:"center",display:"flex",alignItems:"center",gap:3}}>{getFlag(p.loc)} {p.dob!=="TBD"?p.dob.replace(/, /g," "):""}</div>{p.died&&<div style={{fontSize:8,color:C.pa,fontStyle:"italic"}}>passed</div>}</div>);}

function CoupleNode({couple,onClickPerson,depth=0}){const partners=couple.partners.map(id=>byId[id]).filter(Boolean);const children=(couple.children||[]).map(id=>byId[id]).filter(Boolean);const cc=couple.childCouples||[];return(<div style={{display:"flex",flexDirection:"column",alignItems:"center"}}><div style={{display:"flex",alignItems:"flex-end",gap:4}}>{partners.map((p,i)=>(<div key={p.id} style={{display:"flex",alignItems:"flex-end",gap:4}}>{i>0&&<div style={{width:16,height:2,background:C.accent,alignSelf:"center",marginBottom:30}}/>}<TreeCard personId={p.id} onClick={onClickPerson}/></div>))}</div>{(children.length>0||cc.length>0)&&<div style={{width:2,height:20,background:C.accent}}/>}{(children.length>0||cc.length>0)&&(<div style={{position:"relative"}}>{(children.length+cc.length>1)&&<div style={{position:"absolute",top:0,left:"10%",right:"10%",height:2,background:C.accent}}/>}<div style={{display:"flex",gap:12,paddingTop:2,justifyContent:"center",flexWrap:"nowrap"}}>{cc.map(c=>(<div key={c.id} style={{display:"flex",flexDirection:"column",alignItems:"center"}}><div style={{width:2,height:18,background:C.accent}}/><CoupleNode couple={c} onClickPerson={onClickPerson} depth={depth+1}/></div>))}{children.filter(c=>!cc.some(x=>x.partners.includes(c.id))).map(c=>(<div key={c.id} style={{display:"flex",flexDirection:"column",alignItems:"center"}}><div style={{width:2,height:18,background:C.accent}}/><TreeCard personId={c.id} onClick={onClickPerson}/></div>))}</div></div>)}</div>);}

function TreeView({onClickPerson}){const ref=useRef(null);const[z,setZ]=useState(.65);const[ds,setDs]=useState(null);const[ss,setSs]=useState(null);const md=(e)=>{setDs({x:e.clientX,y:e.clientY});setSs({x:ref.current.scrollLeft,y:ref.current.scrollTop});};const mm=useCallback((e)=>{if(!ds||!ss)return;ref.current.scrollLeft=ss.x-(e.clientX-ds.x);ref.current.scrollTop=ss.y-(e.clientY-ds.y);},[ds,ss]);const mu=()=>{setDs(null);setSs(null);};useEffect(()=>{if(ds){window.addEventListener("mousemove",mm);window.addEventListener("mouseup",mu);return()=>{window.removeEventListener("mousemove",mm);window.removeEventListener("mouseup",mu);};}},[ds,mm]);
return(<div style={{flex:1,display:"flex",flexDirection:"column",overflow:"hidden"}}><div style={{display:"flex",gap:8,padding:"8px 16px",alignItems:"center",borderBottom:`1px solid ${C.bo}`,background:C.bg}}><button onClick={()=>setZ(v=>Math.max(.3,v-.1))} style={{width:32,height:32,borderRadius:6,border:`1px solid ${C.bo}`,background:C.card,cursor:"pointer",fontSize:16,fontWeight:700,display:"flex",alignItems:"center",justifyContent:"center"}}>{"\u2212"}</button><span style={{fontSize:12,color:C.ts,minWidth:40,textAlign:"center"}}>{Math.round(z*100)}%</span><button onClick={()=>setZ(v=>Math.min(1.5,v+.1))} style={{width:32,height:32,borderRadius:6,border:`1px solid ${C.bo}`,background:C.card,cursor:"pointer",fontSize:16,fontWeight:700,display:"flex",alignItems:"center",justifyContent:"center"}}>+</button><span style={{fontSize:11,color:C.tm,marginLeft:8}}>Click & drag to pan · Click card for details</span></div>
<div ref={ref} onMouseDown={md} style={{flex:1,overflow:"auto",cursor:ds?"grabbing":"grab",background:C.bg}}><div style={{transform:`scale(${z})`,transformOrigin:"top center",padding:"40px 60px 100px",display:"flex",flexDirection:"column",alignItems:"center",gap:60,minWidth:"fit-content"}}>
<div style={{textAlign:"center",marginBottom:10}}><h2 style={{fontFamily:"'Crimson Pro',serif",fontSize:28,color:C.accent,fontWeight:700,margin:0,letterSpacing:1}}>Heller — Della-Vecchia</h2><div style={{fontSize:13,color:C.tm,marginTop:4}}>5 generations · 60 members · 8 countries</div></div>
<div style={{display:"flex",flexDirection:"column",alignItems:"center",gap:8}}><div style={{fontSize:14,fontWeight:700,color:C.h,fontFamily:"'Crimson Pro',serif",padding:"4px 16px",background:`${C.h}12`,borderRadius:20,border:`1px solid ${C.h}30`}}>Heller Side</div><div style={{display:"flex",gap:60,alignItems:"flex-start"}}>{TREE_DATA.hellerSide.couples.map(c=><CoupleNode key={c.id} couple={c} onClickPerson={onClickPerson}/>)}</div></div>
<div style={{display:"flex",gap:20,flexWrap:"wrap",justifyContent:"center",padding:"16px 20px",background:`${C.h}08`,borderRadius:12,border:`1px dashed ${C.h}30`}}><div style={{width:"100%",textAlign:"center",fontSize:12,color:C.h,fontWeight:600,marginBottom:4}}>Extended Heller Family</div>{[100,101,102,103,3,5,20,21,22].map(id=><TreeCard key={id} personId={id} onClick={onClickPerson}/>)}</div>
<div style={{display:"flex",flexDirection:"column",alignItems:"center",gap:8}}><div style={{fontSize:14,fontWeight:700,color:C.d,fontFamily:"'Crimson Pro',serif",padding:"4px 16px",background:`${C.d}12`,borderRadius:20,border:`1px solid ${C.d}30`}}>Della-Vecchia Side</div><div style={{display:"flex",gap:60,alignItems:"flex-start"}}>{TREE_DATA.dvSide.couples.map(c=><CoupleNode key={c.id} couple={c} onClickPerson={onClickPerson}/>)}</div></div>
</div></div></div>);}

function PersonModal({person:p,onClose}){if(!p)return null;const gc=p.gender==="m"?C.m:C.f;const flag=getFlag(p.loc);const rels=getRelatives(p.id);
return(<div onClick={onClose} style={{position:"fixed",inset:0,background:"rgba(0,0,0,0.45)",display:"flex",alignItems:"center",justifyContent:"center",zIndex:1000,padding:20}}><div onClick={e=>e.stopPropagation()} style={{background:C.card,borderRadius:16,width:"100%",maxWidth:420,maxHeight:"90vh",overflow:"auto",boxShadow:C.sl,border:`2px solid ${gc}40`}}>
<div style={{background:`linear-gradient(135deg,${gc}15,${gc}08)`,padding:"24px 24px 16px",textAlign:"center",borderBottom:`1px solid ${C.bo}`}}><div style={{width:72,height:72,borderRadius:"50%",border:`3px solid ${gc}`,background:`${gc}15`,display:"flex",alignItems:"center",justifyContent:"center",margin:"0 auto 12px",fontSize:24,fontWeight:700,color:gc,fontFamily:"'Crimson Pro',serif"}}>{getInitials(p.name)}</div><h3 style={{margin:0,fontSize:20,fontWeight:700,color:C.tp,fontFamily:"'Crimson Pro',serif"}}>{p.name}</h3>{p.nick&&<div style={{fontSize:14,color:gc,fontStyle:"italic",marginTop:2}}>"{p.nick}"</div>}<div style={{fontSize:13,color:C.ts,marginTop:6,display:"flex",alignItems:"center",justifyContent:"center",gap:6}}>{p.role}{p.died&&<span style={{fontSize:10,background:`${C.pa}20`,color:C.pa,padding:"1px 6px",borderRadius:8}}>passed</span>}</div></div>
<div style={{padding:"16px 24px"}}>{[["Birthday",p.dob||"TBD"],["Location",(flag?flag+" ":"")+(p.loc||"TBD")],["Generation",GEN_LABELS[String(p.gen)]||""],["Family",GROUP_LABELS[p.group]||p.group]].map(([l,v])=>(<div key={l} style={{display:"flex",gap:12,marginBottom:12}}><div style={{fontSize:12,color:C.tm,width:70}}>{l}</div><div style={{fontSize:13,color:C.tp,fontWeight:500}}>{v}</div></div>))}
{p.story&&<div style={{marginTop:8,padding:12,background:`${gc}08`,borderRadius:8,fontSize:13,color:C.ts,lineHeight:1.5,fontStyle:"italic",borderLeft:`3px solid ${gc}40`}}>{p.story}</div>}
{rels.length>0&&(<div style={{marginTop:16}}><div style={{fontSize:12,color:C.tm,marginBottom:8,fontWeight:600}}>Family Connections</div><div style={{display:"flex",flexDirection:"column",gap:6}}>{rels.map(r=>{const rg=r.person.gender==="m"?C.m:C.f;return(<div key={r.person.id} style={{display:"flex",alignItems:"center",gap:8,padding:"6px 8px",background:C.bg,borderRadius:8}}><div style={{width:28,height:28,borderRadius:"50%",border:`2px solid ${r.person.died?C.pa:rg}`,background:`${rg}12`,display:"flex",alignItems:"center",justifyContent:"center",fontSize:10,fontWeight:600,color:rg,fontFamily:"'Crimson Pro',serif",flexShrink:0}}>{getInitials(r.person.name)}</div><div style={{flex:1,fontSize:12,fontWeight:600,color:C.tp,fontFamily:"'Crimson Pro',serif"}}>{r.person.nick?`${r.person.name.split(" ")[0]} "${r.person.nick}"`:r.person.name.split(" ").slice(0,2).join(" ")}</div><div style={{fontSize:10,color:C.tm,fontStyle:"italic"}}>{r.rel}</div></div>);})}</div></div>)}
<div style={{marginTop:16}}><div style={{fontSize:12,color:C.tm,marginBottom:8,fontWeight:600}}>Photos</div><div style={{display:"flex",gap:10}}>{[0,1,2].map(i=>(<div key={i} style={{width:100,height:100,borderRadius:10,border:`2px dashed ${C.bo}`,background:C.bg,display:"flex",alignItems:"center",justifyContent:"center",flexDirection:"column",gap:4}}><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke={C.tm} strokeWidth="1.5"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="m21 15-5-5L5 21"/></svg><span style={{fontSize:9,color:C.tm}}>Add photo</span></div>))}</div></div></div>
<div style={{padding:"12px 24px 20px",textAlign:"center"}}><button onClick={onClose} style={{padding:"8px 32px",borderRadius:8,border:`1px solid ${C.bo}`,background:C.bg,cursor:"pointer",fontSize:13,color:C.ts,fontFamily:"'Crimson Pro',serif"}}>Close</button></div></div></div>);}

function TableView({onClickPerson,searchQuery}){const[gf,setGf]=useState("all");const[sf,setSf]=useState("all");const searching=searchQuery.trim().length>0;
const filtered=useMemo(()=>FAMILY_PEOPLE.filter(p=>{if(gf!=="all"&&String(p.gen)!==gf)return false;if(sf!=="all"&&p.side!==sf)return false;return matchSearch(p,searchQuery);}),[gf,sf,searchQuery]);
const groups=useMemo(()=>{const g={};filtered.forEach(p=>{const k=String(p.gen);if(!g[k])g[k]=[];g[k].push(p);});return Object.entries(g).sort((a,b)=>parseInt(a[0])-parseInt(b[0]));},[filtered]);
return(<div style={{flex:1,overflow:"auto",padding:"0 0 40px"}}><div style={{display:"flex",gap:8,padding:"12px 16px",flexWrap:"wrap",borderBottom:`1px solid ${C.bo}`,position:"sticky",top:0,background:C.bg,zIndex:10}}>
<select value={gf} onChange={e=>setGf(e.target.value)} style={{padding:"6px 10px",borderRadius:8,border:`1px solid ${C.bo}`,fontSize:12,background:C.card,color:C.tp,fontFamily:"'Crimson Pro',serif",cursor:"pointer"}}><option value="all">All Generations</option>{Object.entries(GEN_LABELS).map(([k,v])=><option key={k} value={k}>{v}</option>)}</select>
<select value={sf} onChange={e=>setSf(e.target.value)} style={{padding:"6px 10px",borderRadius:8,border:`1px solid ${C.bo}`,fontSize:12,background:C.card,color:C.tp,fontFamily:"'Crimson Pro',serif",cursor:"pointer"}}><option value="all">All Sides</option><option value="H">Heller</option><option value="D">Della-Vecchia</option><option value="N">Immediate Family</option></select>
<div style={{marginLeft:"auto",fontSize:12,color:C.tm,display:"flex",alignItems:"center"}}>{filtered.length} of {FAMILY_PEOPLE.length} members</div></div>
{groups.map(([gen,members])=>(<div key={gen}><div style={{padding:"12px 16px 6px",fontSize:13,fontWeight:700,color:C.accent,fontFamily:"'Crimson Pro',serif",position:"sticky",top:48,background:C.bg,zIndex:5,borderBottom:`1px solid ${C.bo}`}}>{GEN_LABELS[gen]||`Generation ${gen}`}<span style={{fontSize:11,fontWeight:400,color:C.tm,marginLeft:8}}>({members.length})</span></div>
{members.map(p=>{const gc=p.gender==="m"?C.m:C.f;const flag=getFlag(p.loc);const rels=searching?getRelatives(p.id):[];
return(<div key={p.id}><div onClick={()=>onClickPerson(p)} style={{display:"flex",alignItems:"center",gap:12,padding:"10px 16px",borderBottom:searching&&rels.length>0?"none":`1px solid ${C.bo}50`,cursor:"pointer",opacity:p.died?.65:1}} onMouseEnter={e=>e.currentTarget.style.background=C.hi} onMouseLeave={e=>e.currentTarget.style.background="transparent"}>
<div style={{width:40,height:40,borderRadius:"50%",border:`2px solid ${p.died?C.pa:gc}`,background:`${gc}12`,display:"flex",alignItems:"center",justifyContent:"center",fontSize:13,fontWeight:600,color:gc,fontFamily:"'Crimson Pro',serif",flexShrink:0}}>{getInitials(p.name)}</div>
<div style={{flex:1,minWidth:0}}><div style={{fontSize:14,fontWeight:600,color:C.tp,fontFamily:"'Crimson Pro',serif",display:"flex",alignItems:"center",gap:6}}>{p.name}{p.nick&&<span style={{fontSize:11,color:gc,fontStyle:"italic",fontWeight:400}}>"{p.nick}"</span>}{p.died&&<span style={{fontSize:9,background:`${C.pa}20`,color:C.pa,padding:"1px 5px",borderRadius:6}}>{"\u2020"}</span>}</div><div style={{fontSize:11,color:C.ts,marginTop:1}}>{p.role}</div></div>
<div style={{textAlign:"right",flexShrink:0}}><div style={{fontSize:12,display:"flex",alignItems:"center",gap:4,justifyContent:"flex-end"}}>{flag&&<span style={{fontSize:16}}>{flag}</span>}<span style={{color:C.ts,fontSize:11}}>{p.loc&&p.loc!=="TBD"?p.loc.split(",")[0]:""}</span></div>{p.dob&&p.dob!=="TBD"&&<div style={{fontSize:10,color:C.tm,marginTop:2}}>{p.dob}</div>}</div></div>
{searching&&rels.length>0&&(<div style={{padding:"4px 16px 10px 68px",borderBottom:`1px solid ${C.bo}50`}}><div style={{fontSize:10,color:C.tm,marginBottom:4,fontWeight:600,textTransform:"uppercase",letterSpacing:.5}}>Related</div><div style={{display:"flex",flexWrap:"wrap",gap:6}}>{rels.map(r=>{const rg=r.person.gender==="m"?C.m:C.f;return(<div key={r.person.id} onClick={()=>onClickPerson(r.person)} style={{display:"flex",alignItems:"center",gap:5,padding:"3px 8px 3px 3px",background:`${rg}08`,border:`1px solid ${rg}20`,borderRadius:16,cursor:"pointer"}} onMouseEnter={e=>e.currentTarget.style.background=`${rg}18`} onMouseLeave={e=>e.currentTarget.style.background=`${rg}08`}><div style={{width:20,height:20,borderRadius:"50%",background:`${rg}18`,display:"flex",alignItems:"center",justifyContent:"center",fontSize:8,fontWeight:700,color:rg}}>{getInitials(r.person.name)}</div><span style={{fontSize:11,color:C.tp,fontWeight:500}}>{r.person.nick||r.person.name.split(" ")[0]}</span><span style={{fontSize:9,color:C.tm,fontStyle:"italic"}}>{r.rel}</span></div>);})}</div></div>)}
</div>);})}</div>))}
{filtered.length===0&&<div style={{textAlign:"center",padding:60,color:C.tm,fontFamily:"'Crimson Pro',serif",fontSize:15}}>No family members match your search.</div>}</div>);}

function App(){const[tab,setTab]=useState("list");const[search,setSearch]=useState("");const[sel,setSel]=useState(null);
return(<div style={{width:"100%",height:"100vh",display:"flex",flexDirection:"column",background:C.bg,fontFamily:"'Crimson Pro',Georgia,serif",color:C.tp}}>
<div style={{padding:"16px 16px 0",background:C.bg,borderBottom:`1px solid ${C.bo}`}}>
<div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:12}}><div><h1 style={{margin:0,fontSize:22,fontWeight:700,color:C.accent,letterSpacing:.5,fontFamily:"'Crimson Pro',serif"}}>Heller · Della-Vecchia</h1><div style={{fontSize:12,color:C.tm,marginTop:2}}>{FAMILY_PEOPLE.length} members across 5 generations</div></div><div style={{display:"flex",gap:4,fontSize:20}}>{Object.values(COUNTRY_FLAGS).map((f,i)=><span key={i}>{f}</span>)}</div></div>
<div style={{position:"relative",marginBottom:12}}><svg style={{position:"absolute",left:12,top:"50%",transform:"translateY(-50%)",pointerEvents:"none"}} width="16" height="16" viewBox="0 0 24 24" fill="none" stroke={C.tm} strokeWidth="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg><input type="text" placeholder="Search name, location, birthday month, or year..." value={search} onChange={e=>setSearch(e.target.value)} style={{width:"100%",padding:"10px 12px 10px 38px",borderRadius:10,border:`1px solid ${C.bo}`,background:C.card,fontSize:13,color:C.tp,outline:"none",fontFamily:"'Crimson Pro',serif",boxSizing:"border-box"}}/>{search&&<button onClick={()=>setSearch("")} style={{position:"absolute",right:10,top:"50%",transform:"translateY(-50%)",background:"none",border:"none",cursor:"pointer",color:C.tm,fontSize:18,padding:4}}>{"\u00D7"}</button>}</div>
<div style={{display:"flex"}}>{[{key:"list",icon:"\u2630",label:"Directory"},{key:"tree",icon:"\uD83C\uDF33",label:"Family Tree"}].map(t=>(<button key={t.key} onClick={()=>setTab(t.key)} style={{padding:"8px 20px",fontSize:13,fontWeight:tab===t.key?700:400,color:tab===t.key?C.accent:C.tm,background:tab===t.key?C.card:"transparent",border:tab===t.key?`1px solid ${C.bo}`:"1px solid transparent",borderBottom:tab===t.key?`1px solid ${C.card}`:`1px solid ${C.bo}`,borderRadius:"8px 8px 0 0",cursor:"pointer",fontFamily:"'Crimson Pro',serif",display:"flex",alignItems:"center",gap:6,marginBottom:-1}}><span>{t.icon}</span> {t.label}</button>))}</div></div>
{tab==="list"&&<TableView onClickPerson={setSel} searchQuery={search}/>}
{tab==="tree"&&<TreeView onClickPerson={setSel}/>}
{sel&&<PersonModal person={sel} onClose={()=>setSel(null)}/>}
</div>);}
ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
